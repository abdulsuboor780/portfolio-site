<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Left: Title Area -->
  <g transform="translate(80, 90)">
    <rect width="250" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="6" fill="#a5b4fc"/>
    <text x="38" y="23" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ENTITY CITATION ECOSYSTEM</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Local Citations &amp;</text>
    <text x="0" y="145" fill="url(#cyanGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="900">NAP Consistency</text>

    <g transform="translate(0, 195)" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="24" y="13">Name, Address, Phone (NAP) Standardized</text>
      
      <circle cx="8" cy="40" r="4" fill="#38bdf8"/>
      <text x="24" y="45">Tier 1 Data Aggregators (Data Axle, Foursquare)</text>
      
      <circle cx="8" cy="72" r="4" fill="#38bdf8"/>
      <text x="24" y="77">Zero Duplicate &amp; Conflicting Records</text>
    </g>

    <g transform="translate(0, 315)">
      <rect width="450" height="95" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="30" font-weight="900">100%</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NAP ACCURACY</text>
      </g>
      <line x1="150" y1="20" x2="150" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(175, 25)">
        <text x="0" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="30" font-weight="900">80+</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AUTHORITY CITATIONS</text>
      </g>
      <line x1="310" y1="20" x2="310" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(335, 25)">
        <text x="0" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="30" font-weight="900">0</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SUPPRESSED DUPLICATES</text>
      </g>
    </g>
  </g>

  <!-- Right: Node Network Diagram -->
  <g transform="translate(630, 80)">
    <rect width="490" height="515" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#glow3)"/>
    
    <!-- Central Verified Hub -->
    <g transform="translate(180, 200)">
      <circle cx="65" cy="65" r="75" fill="#064e3b" stroke="#10b981" stroke-width="3" filter="url(#glow3)"/>
      <text x="65" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERIFIED ENTITY</text>
      <text x="65" y="78" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">MONEY SITE</text>
      <text x="65" y="96" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">NAP LOCKED</text>
    </g>

    <!-- Connector Lines -->
    <line x1="245" y1="200" x2="130" y2="100" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <line x1="245" y1="200" x2="370" y2="100" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <line x1="245" y1="330" x2="120" y2="420" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <line x1="245" y1="330" x2="370" y2="420" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>

    <!-- Outer Nodes -->
    <!-- Node 1: Google Business Profile -->
    <g transform="translate(50, 60)">
      <rect width="160" height="70" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Google Maps / GBP</text>
      <text x="80" y="52" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">Primary Hub · DA 100</text>
    </g>

    <!-- Node 2: Apple Maps & Bing Places -->
    <g transform="translate(290, 60)">
      <rect width="160" height="70" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Apple Maps / Bing</text>
      <text x="80" y="52" fill="#c084fc" font-family="sans-serif" font-size="11" text-anchor="middle">Native In-Car GPS</text>
    </g>

    <!-- Node 3: Data Aggregators -->
    <g transform="translate(50, 390)">
      <rect width="160" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Data Axle &amp; Localeze</text>
      <text x="80" y="52" fill="#34d399" font-family="sans-serif" font-size="11" text-anchor="middle">Master Aggregators</text>
    </g>

    <!-- Node 4: BBB & Local Chamber -->
    <g transform="translate(290, 390)">
      <rect width="160" height="70" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="80" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">BBB &amp; Chamber</text>
      <text x="80" y="52" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">Niche High-Trust Links</text>
    </g>
  </g>
</svg>
