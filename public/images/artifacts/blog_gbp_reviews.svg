<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
  </g>

  <!-- Left Side: Title & Info -->
  <g transform="translate(70, 75)">
    <rect width="270" height="34" rx="17" fill="#14532d" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#4ade80"/>
    <text x="36" y="22" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GBP REPUTATION &amp; CONVERSION</text>

    <text x="0" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="900">Google Business Profile</text>
    <text x="0" y="135" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-size="38" font-weight="900">5-Star Conversion Engine</text>

    <g transform="translate(0, 185)" font-family="system-ui, sans-serif" font-size="14.5" fill="#cbd5e1">
      <circle cx="8" cy="8" r="4" fill="#fbbf24"/>
      <text x="24" y="13">Keyword-Enriched Review Velocity &amp; Prominence</text>
      
      <circle cx="8" cy="38" r="4" fill="#fbbf24"/>
      <text x="24" y="43">High-Converting Geotagged Visuals &amp; Products</text>
      
      <circle cx="8" cy="68" r="4" fill="#fbbf24"/>
      <text x="24" y="73">100% Owner Response Rate within 24 Hours</text>
    </g>

    <!-- Stat boxes -->
    <g transform="translate(0, 310)">
      <rect width="450" height="95" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="30" font-weight="900">4.9 ★</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG RATING</text>
      </g>
      <line x1="150" y1="20" x2="150" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(175, 25)">
        <text x="0" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="30" font-weight="900">+42%</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CALL-TO-CLICK RATE</text>
      </g>
      <line x1="310" y1="20" x2="310" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(335, 25)">
        <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="30" font-weight="900">&lt; 24h</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RESPONSE TIME</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Reputation Management & Customer Review Feed Card -->
  <g transform="translate(615, 65)">
    <rect width="515" height="545" rx="24" fill="url(#cardGrad2)" stroke="#334155" stroke-width="2" filter="url(#glow2)"/>
    
    <!-- Header -->
    <rect width="515" height="55" rx="24" fill="#0f172a"/>
    <rect y="25" width="515" height="30" fill="#0f172a"/>
    <text x="25" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Google Customer Reviews &amp; Sentiment</text>
    <rect x="385" y="14" width="105" height="26" rx="8" fill="#14532d"/>
    <text x="437" y="31" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VERIFIED LIVE</text>

    <!-- Review 1 -->
    <g transform="translate(20, 70)">
      <rect width="475" height="135" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="30" r="15" fill="#059669"/>
      <text x="32" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">JS</text>
      <text x="58" y="28" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">James Sullivan</text>
      <text x="58" y="44" fill="#fbbf24" font-family="sans-serif" font-size="12">★★★★★</text>
      <text x="125" y="44" fill="#64748b" font-family="sans-serif" font-size="11">2 days ago</text>
      
      <!-- Multi-line wrapped quote -->
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12">
        <tspan x="20" dy="0">"Fastest emergency AC repair service in Dallas! Found them on</tspan>
        <tspan x="20" dy="18">Google Maps and they arrived in 30 minutes."</tspan>
      </text>
      
      <rect x="20" y="102" width="130" height="20" rx="4" fill="#064e3b"/>
      <text x="27" y="115" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="600">Mentioned: AC Repair</text>
    </g>

    <!-- Review 2 -->
    <g transform="translate(20, 220)">
      <rect width="475" height="135" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="30" r="15" fill="#0284c7"/>
      <text x="32" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">MR</text>
      <text x="58" y="28" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Maria Rodriguez</text>
      <text x="58" y="44" fill="#fbbf24" font-family="sans-serif" font-size="12">★★★★★</text>
      <text x="125" y="44" fill="#64748b" font-family="sans-serif" font-size="11">1 week ago</text>
      
      <!-- Multi-line wrapped quote -->
      <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12">
        <tspan x="20" dy="0">"Top notch contractor! Highly recommend their furnace</tspan>
        <tspan x="20" dy="18">installation team. Professional, clean, and upfront pricing."</tspan>
      </text>
      
      <rect x="20" y="102" width="155" height="20" rx="4" fill="#0c4a6e"/>
      <text x="27" y="115" fill="#7dd3fc" font-family="sans-serif" font-size="10.5" font-weight="600">Mentioned: Furnace Install</text>
    </g>

    <!-- Owner Response Box with proper multi-line wrapping -->
    <g transform="translate(20, 370)">
      <rect width="475" height="150" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
      <text x="20" y="28" fill="#a7f3d0" font-family="sans-serif" font-size="11.5" font-weight="800">BUSINESS OWNER RESPONSE (AUTOMATED TEMPLATE):</text>
      
      <text x="20" y="52" fill="#ffffff" font-family="sans-serif" font-size="12" font-style="italic">
        <tspan x="20" dy="0">"Thank you Maria! Our certified technicians take great pride in</tspan>
        <tspan x="20" dy="19">delivering fast furnace installation and heating maintenance</tspan>
        <tspan x="20" dy="19">across the greater Dallas metro area."</tspan>
      </text>
      
      <g transform="translate(20, 122)">
        <circle cx="6" cy="6" r="4" fill="#4ade80"/>
        <text x="18" y="10" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700">Responded in 3h 12m · Positive Sentiment Confirmed</text>
      </g>
    </g>
  </g>
</svg>
