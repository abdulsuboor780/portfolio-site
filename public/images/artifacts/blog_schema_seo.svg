<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad5)"/>

  <!-- Left: Header -->
  <g transform="translate(80, 90)">
    <rect width="250" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="6" fill="#34d399"/>
    <text x="38" y="23" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SEMANTIC AI SEARCH SIGNALS</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Advanced JSON-LD</text>
    <text x="0" y="145" fill="url(#codeGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Local Schema Markup</text>

    <g transform="translate(0, 195)" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <text x="24" y="13">LocalBusiness, Service &amp; FAQPage Nested Trees</text>
      
      <circle cx="8" cy="40" r="4" fill="#10b981"/>
      <text x="24" y="45">Wikidata &amp; Wikipedia sameAs Entity Authority</text>
      
      <circle cx="8" cy="72" r="4" fill="#10b981"/>
      <text x="24" y="77">AI Overviews &amp; Search Generative Experience Ready</text>
    </g>

    <g transform="translate(0, 315)">
      <rect width="450" height="95" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="30" font-weight="900">100%</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">VALID SCHEMA.ORG</text>
      </g>
      <line x1="160" y1="20" x2="160" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(185, 25)">
        <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="30" font-weight="900">Rich</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SERP SNIPPETS</text>
      </g>
      <line x1="310" y1="20" x2="310" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(335, 25)">
        <text x="0" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="30" font-weight="900">0 Err</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SEARCH CONSOLE</text>
      </g>
    </g>
  </g>

  <!-- Right: Code Terminal Window -->
  <g transform="translate(630, 80)">
    <rect width="490" height="515" rx="20" fill="#030712" stroke="#1e293b" stroke-width="2" filter="url(#glow5)"/>
    
    <!-- Code Editor Header -->
    <rect width="490" height="42" rx="20" fill="#0f172a"/>
    <rect y="20" width="490" height="22" fill="#0f172a"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>
    <text x="85" y="25" fill="#64748b" font-family="monospace" font-size="12">schema-local-business.jsonld</text>
    
    <!-- Code Content -->
    <g transform="translate(25, 60)" font-family="monospace" font-size="12.5" xml:space="preserve">
      <text y="18" fill="#64748b">&lt;<tspan fill="#38bdf8">script</tspan> <tspan fill="#a78bfa">type</tspan>=<tspan fill="#34d399">"application/ld+json"</tspan>&gt;</text>
      <text y="38" fill="#f8fafc">{</text>
      <text y="58" fill="#94a3b8">  <tspan fill="#38bdf8">"@context"</tspan>: <tspan fill="#34d399">"https://schema.org"</tspan>,</text>
      <text y="78" fill="#94a3b8">  <tspan fill="#38bdf8">"@type"</tspan>: [<tspan fill="#34d399">"PlumbingBusiness"</tspan>, <tspan fill="#34d399">"ProfessionalService"</tspan>],</text>
      <text y="98" fill="#94a3b8">  <tspan fill="#38bdf8">"@id"</tspan>: <tspan fill="#34d399">"https://example.com/#business"</tspan>,</text>
      <text y="118" fill="#94a3b8">  <tspan fill="#38bdf8">"name"</tspan>: <tspan fill="#34d399">"Apex Plumbing &amp; Drain Pros"</tspan>,</text>
      <text y="138" fill="#94a3b8">  <tspan fill="#38bdf8">"telephone"</tspan>: <tspan fill="#34d399">"+1-214-555-0199"</tspan>,</text>
      <text y="158" fill="#94a3b8">  <tspan fill="#38bdf8">"priceRange"</tspan>: <tspan fill="#34d399">"$$"</tspan>,</text>
      <text y="178" fill="#94a3b8">  <tspan fill="#38bdf8">"geo"</tspan>: {</text>
      <text y="198" fill="#94a3b8">    <tspan fill="#38bdf8">"@type"</tspan>: <tspan fill="#34d399">"GeoCoordinates"</tspan>,</text>
      <text y="218" fill="#94a3b8">    <tspan fill="#38bdf8">"latitude"</tspan>: <tspan fill="#f59e0b">32.7767</tspan>, <tspan fill="#38bdf8">"longitude"</tspan>: <tspan fill="#f59e0b">-96.7970</tspan></text>
      <text y="238" fill="#94a3b8">  },</text>
      <text y="258" fill="#94a3b8">  <tspan fill="#38bdf8">"sameAs"</tspan>: [</text>
      <text y="278" fill="#94a3b8">    <tspan fill="#34d399">"https://en.wikipedia.org/wiki/Plumber"</tspan>,</text>
      <text y="298" fill="#94a3b8">    <tspan fill="#34d399">"https://www.wikidata.org/wiki/Q252060"</tspan></text>
      <text y="318" fill="#94a3b8">  ],</text>
      <text y="338" fill="#94a3b8">  <tspan fill="#38bdf8">"aggregateRating"</tspan>: {</text>
      <text y="358" fill="#94a3b8">    <tspan fill="#38bdf8">"ratingValue"</tspan>: <tspan fill="#f59e0b">"4.9"</tspan>, <tspan fill="#38bdf8">"reviewCount"</tspan>: <tspan fill="#f59e0b">"184"</tspan></text>
      <text y="378" fill="#94a3b8">  }</text>
      <text y="398" fill="#f8fafc">}</text>
      <text y="418" fill="#64748b">&lt;/<tspan fill="#38bdf8">script</tspan>&gt;</text>
    </g>
  </g>
</svg>
