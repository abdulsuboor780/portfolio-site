<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad6)"/>

  <!-- Left Side: Title & Key Elements -->
  <g transform="translate(80, 90)">
    <rect width="250" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="6" fill="#34d399"/>
    <text x="38" y="23" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">PERFORMANCE &amp; AUDIT</text>

    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Technical SEO Audit</text>
    <text x="0" y="145" fill="url(#speedGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Core Web Vitals 99+</text>

    <g transform="translate(0, 195)" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">
      <circle cx="8" cy="8" r="4" fill="#22c55e"/>
      <text x="24" y="13">Largest Contentful Paint (LCP) Under 0.8s</text>
      
      <circle cx="8" cy="40" r="4" fill="#22c55e"/>
      <text x="24" y="45">Interaction to Next Paint (INP) Under 50ms</text>
      
      <circle cx="8" cy="72" r="4" fill="#22c55e"/>
      <text x="24" y="77">Zero Broken Links, 100% Mobile Clean Architecture</text>
    </g>

    <g transform="translate(0, 315)">
      <rect width="450" height="95" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="24" fill="#22c55e" font-family="system-ui, sans-serif" font-size="30" font-weight="900">99/100</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PAGESPEED SCORE</text>
      </g>
      <line x1="160" y1="20" x2="160" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(185, 25)">
        <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="30" font-weight="900">0.7s</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FIRST CONTENTFUL PAINT</text>
      </g>
      <line x1="310" y1="20" x2="310" y2="75" stroke="#334155" stroke-width="1"/>
      <g transform="translate(335, 25)">
        <text x="0" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="30" font-weight="900">100%</text>
        <text x="0" y="45" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACCESSIBILITY</text>
      </g>
    </g>
  </g>

  <!-- Right: Lighthouse Audit Gauges Card -->
  <g transform="translate(630, 80)">
    <rect width="490" height="515" rx="24" fill="#0b1329" stroke="#334155" stroke-width="2" filter="url(#glow6)"/>
    
    <!-- Header -->
    <rect width="490" height="50" rx="24" fill="#0f172a"/>
    <rect y="25" width="490" height="25" fill="#0f172a"/>
    <text x="25" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Google Lighthouse 10.0 Performance Report</text>
    
    <!-- 4 Circular Scores -->
    <g transform="translate(25, 75)">
      <!-- Score 1: Performance -->
      <g transform="translate(30, 45)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="40" cy="40" r="35" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="220" stroke-dashoffset="5" stroke-linecap="round"/>
        <text x="40" y="47" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">99</text>
        <text x="40" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Performance</text>
      </g>

      <!-- Score 2: Accessibility -->
      <g transform="translate(135, 45)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="40" cy="40" r="35" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="220" stroke-dashoffset="0" stroke-linecap="round"/>
        <text x="40" y="47" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">100</text>
        <text x="40" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Accessibility</text>
      </g>

      <!-- Score 3: Best Practices -->
      <g transform="translate(240, 45)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="40" cy="40" r="35" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="220" stroke-dashoffset="0" stroke-linecap="round"/>
        <text x="40" y="47" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">100</text>
        <text x="40" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Best Practices</text>
      </g>

      <!-- Score 4: SEO -->
      <g transform="translate(345, 45)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="40" cy="40" r="35" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="220" stroke-dashoffset="0" stroke-linecap="round"/>
        <text x="40" y="47" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">100</text>
        <text x="40" y="95" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">SEO</text>
      </g>
    </g>

    <!-- Metrics List -->
    <g transform="translate(25, 230)">
      <rect width="440" height="255" rx="14" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      
      <g transform="translate(20, 25)">
        <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="13">First Contentful Paint (FCP)</text>
        <text x="400" y="16" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="end">0.6 s</text>
      </g>
      <line x1="20" y1="52" x2="420" y2="52" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(20, 65)">
        <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="13">Largest Contentful Paint (LCP)</text>
        <text x="400" y="16" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="end">0.9 s</text>
      </g>
      <line x1="20" y1="92" x2="420" y2="92" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(20, 105)">
        <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="13">Total Blocking Time (TBT)</text>
        <text x="400" y="16" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="end">0 ms</text>
      </g>
      <line x1="20" y1="132" x2="420" y2="132" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(20, 145)">
        <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="13">Cumulative Layout Shift (CLS)</text>
        <text x="400" y="16" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="end">0.001</text>
      </g>
      <line x1="20" y1="172" x2="420" y2="172" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(20, 185)">
        <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="13">Speed Index</text>
        <text x="400" y="16" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="end">0.7 s</text>
      </g>
    </g>
  </g>
</svg>
